{{ define "header" }}
<!doctype html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
        <base target="_blank">

        <style>
            /* giuseppecorso.it palette: paper, ink, teal accent */
            body {
                background-color: #f2ede4;
                font-family: 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif;
                font-size: 16px;
                line-height: 26px;
                margin: 0;
                color: #23262b;
            }

            .wrap {
                background-color: #ffffff;
                padding: 30px;
                max-width: 525px;
                margin: 0 auto;
                border: 1px solid #e2dbcf;
                border-radius: 6px;
            }

            .header {
                border-bottom: 1px solid #e2dbcf;
                padding-bottom: 15px;
                margin-bottom: 20px;
            }
                .header a {
                    text-decoration: none;
                }
                .header img {
                    vertical-align: middle;
                    margin-right: 10px;
                }
                .brand {
                    vertical-align: middle;
                    font-size: 17px;
                    font-weight: 800;
                    letter-spacing: .01em;
                    color: #23262b;
                }
                .brand span {
                    color: #0f6e66;
                }

            h2 {
                font-family: Georgia, 'Times New Roman', serif;
                font-weight: normal;
                font-size: 26px;
                line-height: 32px;
                color: #23262b;
                margin: 0 0 15px;
            }

            .footer {
                text-align: center;
                font-size: 12px;
                color: #5a606b;
            }
                .footer a {
                    color: #5a606b;
                }

            .gutter {
                padding: 30px;
            }
            .button {
                background: #0f6e66;
                color: #fff !important;
                display: inline-block;
                border-radius: 6px;
                padding: 12px 30px;
                text-align: center;
                text-decoration: none;
                font-weight: bold;
            }
            .button:hover {
                background: #0a524c;
                color: #fff;
            }
            img {
                max-width: 100%;
            }

            a {
                color: #0f6e66;
            }
                a:hover {
                    color: #0a524c;
                }
            .small {
                font-size: 13px;
                color: #5a606b;
            }
            @media screen and (max-width: 600px) {
                .wrap {
                    max-width: auto;
                }
                .gutter {
                    padding: 10px;
                }
            }
        </style>
    </head>
<body style="background-color: #f2ede4;">
    <div class="gutter">&nbsp;</div>
    <div class="wrap">
        <div class="header">
            <a href="https://giuseppecorso.it/">
                <img src="https://giuseppecorso.it/email-logo.png" width="48" height="48" alt="" /><span class="brand">GIUSEPPE<span>CORSO</span></span>
            </a>
        </div>
{{ end }}

{{ define "footer" }}
    </div>

    <div class="footer">
        <p>Giuseppe Corso · <a href="https://giuseppecorso.it/">giuseppecorso.it</a> · <a href="https://giuseppecorso.it/privacy/">Privacy</a></p>
    </div>
    <div class="gutter">&nbsp;</div>
</body>
</html>
{{ end }}
