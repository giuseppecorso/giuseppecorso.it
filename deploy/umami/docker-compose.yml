# Umami (cookieless analytics) — lives in /opt/umami on the VPS.
# Based on the official compose file, pinned to a stable release.
# Secrets come from the .env file next to this one (never committed).
services:
  umami:
    image: ghcr.io/umami-software/umami:${UMAMI_TAG}
    container_name: umami_app
    ports:
      - "127.0.0.1:3000:3000"   # reachable only through the host nginx
    environment:
      DATABASE_URL: postgresql://umami:${POSTGRES_PASSWORD}@db:5432/umami
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in your .env file}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
  db:
    image: postgres:15-alpine
    container_name: umami_db
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  umami-db-data:
