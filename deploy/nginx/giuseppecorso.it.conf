# /etc/nginx/sites-available/giuseppecorso.it
# Static site built by Astro. Certificate managed by certbot (auto-renew).
# NOTE: do not add "ipv6only=on" here: it is already set in another vhost.

# http (both names) -> https://giuseppecorso.it
server {
    listen 80;
    listen [::]:80;
    server_name giuseppecorso.it www.giuseppecorso.it;
    return 301 https://giuseppecorso.it$request_uri;
}

# https://www -> https://giuseppecorso.it
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.giuseppecorso.it;

    ssl_certificate /etc/letsencrypt/live/giuseppecorso.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/giuseppecorso.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://giuseppecorso.it$request_uri;
}

# the site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name giuseppecorso.it;

    ssl_certificate /etc/letsencrypt/live/giuseppecorso.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/giuseppecorso.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/giuseppecorso.it/current;
    index index.html;

    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Hashed file names: safe to cache forever.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
